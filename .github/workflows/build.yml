name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          chosen=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          [ -z "$chosen" ] && { ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$chosen/Contents/Developer"
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          udid=$(xcrun simctl list devices available | grep "$name (" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild build -project Quiver.xcodeproj -scheme Quiver -configuration Debug             -destination "id=$udid" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Screenshots
        timeout-minutes: 25
        run: |
          # A fresh device: bootstatus on the runner's default simulator hung for 15+ minutes before.
          rt=$(xcrun simctl list runtimes | grep -oE "com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+" | sort -V | tail -1)
          udid=$(xcrun simctl create shots "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "$rt")
          xcrun simctl shutdown all || true
          xcrun simctl boot "$udid" || true
          for i in $(seq 1 60); do
            xcrun simctl spawn "$udid" launchctl print system >/dev/null 2>&1 && break
            sleep 5
          done
          sleep 20
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl ui "$udid" appearance dark || true
          app=$(find dd/Build/Products -name "Quiver.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$udid" "$app"
          mkdir -p shots iap
          # A first launch after install is slow; warm it up so the first shot is not blank paper.
          xcrun simctl launch "$udid" com.mattbusel.quiver -shot arrow || true
          sleep 15
          i=0
          for shot in scoring session widgets tape print insights range builder bow themes; do
            xcrun simctl terminate "$udid" com.mattbusel.quiver || true
            xcrun simctl launch "$udid" com.mattbusel.quiver -shot $shot
            sleep 8
            xcrun simctl io "$udid" screenshot "shots/$(printf %02d $i)-$shot.png"
            i=$((i+1))
          done
          # App Review screenshots for the purchases (never used on the store page).
          for shot in paywall plus shopbuy; do
            xcrun simctl terminate "$udid" com.mattbusel.quiver || true
            xcrun simctl launch "$udid" com.mattbusel.quiver -shot $shot
            sleep 8
            xcrun simctl io "$udid" screenshot "iap/$shot.png"
          done
      - name: App Preview recording
        timeout-minutes: 8
        run: |
          udid=$(xcrun simctl list devices | grep "shots (" | grep -oE "[0-9A-F-]{36}" | head -1)
          xcrun simctl terminate "$udid" com.mattbusel.quiver || true
          data=$(xcrun simctl get_app_container "$udid" com.mattbusel.quiver data)
          rm -f "$data/Documents/demo_done"
          mkdir -p preview
          xcrun simctl io "$udid" recordVideo --codec h264 --force preview/preview.mp4 &
          rec=$!
          sleep 3
          xcrun simctl launch "$udid" com.mattbusel.quiver -preview
          for i in $(seq 1 120); do
            [ -f "$data/Documents/demo_done" ] && break
            sleep 0.5
          done
          sleep 1
          kill -INT $rec 2>/dev/null || true
          wait $rec 2>/dev/null || true
          ls -la preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            shots
            iap
            preview
